<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garments Hero Telegram Mini App</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/adsgram.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col">

    <!-- App Header with Admin 5-Click Trigger -->
    <header class="p-4 bg-slate-800 flex justify-between items-center shadow-md">
        <h1 id="adminTrigger" class="text-xl font-bold cursor-pointer select-none text-cyan-400">Garments Hero</h1>
        <div class="flex items-center gap-2">
            <span id="userCoinsDisplay" class="bg-slate-700 px-3 py-1 rounded-full text-sm font-semibold">🪙 0 Coins</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 p-4 max-w-md w-full mx-auto pb-20">
        
        <!-- Timer Section (Dynamic Hide/Show & Control) -->
        <div id="timerSection" class="bg-slate-800 p-4 rounded-xl mb-4 text-center shadow border border-slate-700">
            <h2 class="text-sm text-slate-400 mb-1">Campaign Countdown</h2>
            <div id="countdownDisplay" class="text-2xl font-mono font-bold text-yellow-400">00:00:00</div>
        </div>

        <!-- Task Section (Empty by default, loads active admin tasks) -->
        <div class="bg-slate-800 p-4 rounded-xl mb-4 shadow border border-slate-700">
            <h2 class="text-lg font-semibold mb-3 text-cyan-300">Active Tasks</h2>
            <div id="userTasksContainer" class="space-y-3">
                <p class="text-slate-400 text-sm italic text-center py-2">No active tasks right now. Check back later!</p>
            </div>
        </div>

        <!-- Ads Section -->
        <div class="bg-slate-800 p-4 rounded-xl text-center shadow border border-slate-700">
            <h2 class="text-md font-semibold mb-2">Watch & Earn</h2>
            <button onclick="showAd('46414')" class="bg-cyan-600 hover:bg-cyan-500 w-full py-2 rounded-lg font-bold transition">Watch Ad (int-46414)</button>
        </div>
    </main>

    <!-- Admin Panel Modal (Hidden by default) -->
    <div id="adminModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 w-full max-w-lg rounded-2xl p-5 max-h-[90vh] overflow-y-auto border border-slate-700">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                <h2 class="text-xl font-bold text-cyan-400">Admin Control Panel</h2>
                <button onclick="closeAdminPanel()" class="text-red-400 font-bold text-lg px-2">✕</button>
            </div>

            <!-- Tabs / Sections inside Admin -->
            <div class="space-y-6">
                <!-- 1. Timer Controls -->
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
                    <h3 class="font-semibold text-sm mb-2 text-yellow-400">Timer Controls</h3>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <button onclick="updateTimerState('play')" class="bg-green-600 py-1 rounded text-sm font-bold">Play</button>
                        <button onclick="updateTimerState('stop')" class="bg-red-600 py-1 rounded text-sm font-bold">Stop</button>
                        <button onclick="updateTimerState('hide')" class="bg-gray-600 py-1 rounded text-sm font-bold">Hide</button>
                        <button onclick="updateTimerState('show')" class="bg-blue-600 py-1 rounded text-sm font-bold">Show</button>
                    </div>
                    <input type="datetime-local" id="adminTargetTime" class="w-full bg-slate-800 border border-slate-600 rounded p-1 text-sm text-white mb-2">
                    <button onclick="saveAdminTimer()" class="w-full bg-cyan-600 py-1.5 rounded text-sm font-bold">Update Target Time</button>
                </div>

                <!-- 2. Task Publisher -->
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
                    <h3 class="font-semibold text-sm mb-2 text-cyan-400">Publish New Task</h3>
                    <input type="text" id="adminTaskTitle" placeholder="Task Title (e.g., Send Money to bKash)" class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm mb-2">
                    <textarea id="adminTaskDesc" placeholder="Task Details & Number..." class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm mb-2 h-20"></textarea>
                    <button onclick="publishTask()" class="w-full bg-cyan-600 py-2 rounded text-sm font-bold">Publish Task</button>
                </div>

                <!-- 3. Task Submissions & Verification -->
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
                    <h3 class="font-semibold text-sm mb-2 text-yellow-400">Pending Task Proofs</h3>
                    <div id="adminPendingProofs" class="space-y-2 max-h-40 overflow-y-auto">
                        <p class="text-slate-500 text-xs text-center">No pending submissions.</p>
                    </div>
                </div>

                <!-- 4. User Full List & Management -->
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
                    <h3 class="font-semibold text-sm mb-2 text-green-400">All Users List</h3>
                    <div id="adminUserList" class="space-y-2 max-h-48 overflow-y-auto">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase & App Script Logic -->
    <script>
        // Firebase Configuration (Replace with your keys)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. LocalStorage Identity Management (Prevents duplicate guest creation on refresh)
        let userId = localStorage.getItem('gh_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('gh_user_id', userId);
        }

        const username = "masudranasagor"; // Default or Telegram user name

        // Register User in Firebase Realtime Database
        const userRef = db.ref('users/' + userId);
        userRef.update({
            id: userId,
            username: username,
            lastActive: Date.now()
        });

        // Listen to User Data (Coins)
        userRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.coins !== undefined) {
                document.getElementById('userCoinsDisplay').innerText = `🪙 ${data.coins} Coins`;
            } else {
                userRef.update({ coins: 0 });
            }
        });

        // 2. Admin 5-Click Trigger & PIN Authentication
        let clickCount = 0;
        document.getElementById('adminTrigger').addEventListener('click', () => {
            clickCount++;
            if (clickCount === 5) {
                clickCount = 0;
                const pin = prompt("Enter Admin PIN:");
                if (pin === "5229") {
                    document.getElementById('adminModal').classList.remove('hidden');
                    loadAdminData();
                } else {
                    alert("Incorrect PIN!");
                }
            }
            setTimeout(() => { clickCount = 0; }, 3000); // Reset after 3s
        });

        function closeAdminPanel() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        // 3. Adsgram Integration
        function showAd(blockId) {
            if (typeof Adsgram !== 'undefined') {
                Adsgram.init({ blockId: blockId }).show().then((result) => {
                    // Reward user
                    userRef.transaction(current => {
                        if (current) current.coins = (current.coins || 0) + 10;
                        return current;
                    });
                    alert("Reward added successfully!");
                }).catch((err) => {
                    alert("Ad failed or was closed early.");
                });
            } else {
                alert("Adsgram SDK not loaded.");
            }
        }

        // 4. Timer Logic & Synchronization
        db.ref('settings/timer').on('value', (snapshot) => {
            const timerData = snapshot.val();
            const timerSec = document.getElementById('timerSection');
            if (!timerData) return;

            if (timerData.visibility === 'hide') {
                timerSec.classList.add('hidden');
            } else {
                timerSec.classList.remove('hidden');
            }
            // Additional countdown logic can be handled here based on timerData.targetTime
        });

        function updateTimerState(action) {
            if (action === 'hide' || action === 'show') {
                db.ref('settings/timer/visibility').set(action);
            } else if (action === 'play' || action === 'stop') {
                db.ref('settings/timer/status').set(action);
            }
            alert(`Timer status updated to: ${action}`);
        }

        function saveAdminTimer() {
            const timeVal = document.getElementById('adminTargetTime').value;
            if (!timeVal) return alert("Select a valid time!");
            db.ref('settings/timer').update({ targetTime: new Date(timeVal).getTime() });
            alert("Timer target updated!");
        }

        // 5. Dynamic Tasks & Photo Proof Submission
        db.ref('activeTask').on('value', (snapshot) => {
            const task = snapshot.val();
            const container = document.getElementById('userTasksContainer');
            if (!task) {
                container.innerHTML = `<p class="text-slate-400 text-sm italic text-center py-2">No active tasks right now.</p>`;
                return;
            }

            container.innerHTML = `
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
                    <h4 class="font-bold text-cyan-300 text-sm">${task.title}</h4>
                    <p class="text-xs text-slate-300 mt-1 mb-2">${task.desc}</p>
                    <div class="space-y-2">
                        <input type="text" id="userTrxId" placeholder="Enter TrxID or Number" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-xs text-white">
                        <input type="file" id="userProofPhoto" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-cyan-600 file:text-white">
                        <button onclick="submitTaskProof()" class="w-full bg-green-600 py-1.5 rounded text-xs font-bold">Submit Proof</button>
                    </div>
                </div>
            `;
        });

        function publishTask() {
            const title = document.getElementById('adminTaskTitle').value;
            const desc = document.getElementById('adminTaskDesc').value;
            if (!title || !desc) return alert("Fill in all fields!");

            db.ref('activeTask').set({
                title: title,
                desc: desc,
                timestamp: Date.now()
            });
            alert("Task published successfully!");
        }

        function submitTaskProof() {
            const trxId = document.getElementById('userTrxId').value;
            const photoInput = document.getElementById('userProofPhoto');
            if (!trxId) return alert("Please enter your TrxID/Proof details!");

            // Convert photo to base64 if provided
            let photoData = "";
            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    photoData = e.target.result;
                    saveSubmissionToFirebase(trxId, photoData);
                };
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                saveSubmissionToFirebase(trxId, "");
            }
        }

        function saveSubmissionToFirebase(trxId, photo) {
            const subRef = db.ref('taskSubmissions').push();
            subRef.set({
                subId: subRef.key,
                userId: userId,
                username: username,
                trxId: trxId,
                photo: photo,
                status: 'pending',
                timestamp: Date.now()
            });
            alert("Proof submitted successfully! Awaiting admin approval.");
        }

        // 6. Admin Data Loader (Full User List & Submissions)
        function loadAdminData() {
            // Load Submissions for Verification
            db.ref('taskSubmissions').on('value', (snapshot) => {
                const subs = snapshot.val();
                const container = document.getElementById('adminPendingProofs');
                container.innerHTML = "";
                if (!subs) {
                    container.innerHTML = `<p class="text-slate-500 text-xs text-center">No pending submissions.</p>`;
                    return;
                }

                Object.keys(subs).forEach(key => {
                    const sub = subs[key];
                    if (sub.status === 'pending') {
                        container.innerHTML += `
                            <div class="bg-slate-800 p-2 rounded border border-slate-700 text-xs">
                                <p><strong>User:</strong> ${sub.username} (${sub.userId})</p>
                                <p><strong>TrxID:</strong> ${sub.trxId}</p>
                                ${sub.photo ? `<a href="${sub.photo}" target="_blank" class="text-cyan-400 underline block my-1">View Screenshot</a>` : ''}
                                <div class="flex gap-2 mt-2">
                                    <button onclick="verifySubmission('${sub.subId}', '${sub.userId}', 'approve')" class="bg-green-600 px-2 py-1 rounded font-bold flex-1">Approve</button>
                                    <button onclick="verifySubmission('${sub.subId}', '${sub.userId}', 'reject')" class="bg-red-600 px-2 py-1 rounded font-bold flex-1">Reject</button>
                                </div>
                            </div>
                        `;
                    }
                });
            });

            // Load Full User List
            db.ref('users').on('value', (snapshot) => {
                const users = snapshot.val();
                const container = document.getElementById('adminUserList');
                container.innerHTML = "";
                if (!users) return;

                Object.keys(users).forEach(key => {
                    const u = users[key];
                    container.innerHTML += `
                        <div class="bg-slate-800 p-2 rounded border border-slate-700 flex justify-between items-center text-xs">
                            <div>
                                <p class="font-bold text-cyan-300">${u.username || 'Guest'} <span class="text-slate-400 font-normal">(${u.id})</span></p>
                                <p>Coins: <span id="coin-val-${u.id}">${u.coins || 0}</span></p>
                            </div>
                            <div class="flex gap-1">
                                <input type="number" id="edit-coin-${u.id}" value="${u.coins || 0}" class="w-16 bg-slate-900 border border-slate-600 rounded px-1 text-white">
                                <button onclick="updateUserCoins('${u.id}')" class="bg-cyan-600 px-2 py-1 rounded font-bold">Save</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function verifySubmission(subId, targetUserId, action) {
            if (action === 'approve') {
                // Give reward (e.g., 50 coins)
                db.ref('users/' + targetUserId + '/coins').transaction(current => (current || 0) + 50);
                db.ref('taskSubmissions/' + subId + '/status').set('approved');
                alert("Submission Approved and coins added!");
            } else {
                db.ref('taskSubmissions/' + subId + '/status').set('rejected');
                alert("Submission Rejected.");
            }
        }

        function updateUserCoins(targetUserId) {
            const newCoins = parseInt(document.getElementById(`edit-coin-${targetUserId}`).value);
            if (isNaN(newCoins)) return alert("Enter valid number!");
            db.ref('users/' + targetUserId + '/coins').set(newCoins);
            alert("User coins updated successfully!");
        }
    </script>
</body>
</html>
