<!DOCTYPE html>
<html lang="bn">
<head>
    <meta name="monetag" content="713c462f8287529e227a1dc55fdecd73">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Earn Pro - Dynamic Task Edition</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #ffffff);
            --tg-text: var(--tg-theme-text-color, #222222);
            --tg-btn: var(--tg-theme-button-color, #2481cc);
            --tg-btn-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f2f5);
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--tg-bg); color: var(--tg-text); margin: 0; padding: 0; text-align: center; }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .page { display: none; padding-bottom: 50px; }
        .active { display: block; }
        .card { background: var(--secondary-bg); padding: 20px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: left; color: #000; }
        
        /* Dynamic Task Style */
        .task-card { background: linear-gradient(135deg, #6a11cb, #2575fc); color: #fff; padding: 15px; border-radius: 15px; margin-bottom: 15px; text-align: center; }
        .task-card h4 { margin: 0; font-size: 18px; }
        .task-card p { font-size: 12px; margin: 8px 0; opacity: 0.9; }
        .task-btn { background: #fff; color: #2575fc; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .token-display { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 2px solid #fff; text-align: center;}
        .token-count { font-size: 35px; font-weight: bold; display: block; }
        
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: var(--tg-btn); color: var(--tg-btn-text); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .progress-container { background: #ddd; height: 14px; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .progress-fill { background: #4caf50; width: 0%; height: 100%; transition: 0.5s; }
        
        #loading-screen { padding: 100px 20px; font-weight: bold; font-size: 18px; color: var(--tg-text); }
        .user-item { background: #fff; padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #ddd; font-size: 13px; color: #000; }
        .ad-slot { margin: 10px 0; min-height: 55px; background: #eee; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden;}
    </style>
</head>
<body>

<div id="loading-screen">ডেটাবেসে কানেক্ট হচ্ছে... <br><small>দয়া করে অপেক্ষা করুন</small></div>

<div class="container" id="main-content" style="display: none;">

    <div id="reg-page" class="page">
        <div class="card" style="text-align: center;">
            <h2 style="margin:0;">একাউন্ট লগইন</h2>
            <input type="text" id="u-name" placeholder="আপনার নাম">
            <input type="tel" id="u-mobile" placeholder="মোবাইল নম্বর">
            <input type="password" id="u-pin" placeholder="৪ ডিজিট পিন" maxlength="4">
            <button onclick="handleAuth()">শুরু করুন</button>
        </div>
    </div>

    <div id="dash-page" class="page">
        <div class="ad-slot">
            <script type="text/javascript">
                atOptions = { 'key' : '22791b3315db724a6660643268b32cc2', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
            </script>
            <script type="text/javascript" src="//www.highrevenueformat.com/22791b3315db724a6660643268b32cc2/invoke.js"></script>
        </div>

        <!-- ডাইনামিক টাস্ক এরিয়া -->
        <div id="dynamic-tasks-area"></div>

        <div id="notice-text" class="card" style="background:#fff9c4; font-size:12px; font-weight:bold; text-align:center; color:#856404; padding:10px;">লোড হচ্ছে...</div>

        <div class="token-display">
            <small>ব্যালেন্স</small>
            <span class="token-count" id="token-val">0.0</span>
            <div style="display: flex; justify-content: space-between; margin-top: 5px; font-weight: bold; font-size: 14px;">
                <span>৳ <b id="taka-val">0.00</b></span>
                <span>লেভেল: <b id="lvl-val">1</b></span>
            </div>
        </div>

        <div class="card" style="text-align: center;">
            <h3 style="margin:0;">ভিডিও টাস্ক (১২টি)</h3>
            <div class="progress-container"><div id="progress-bar" class="progress-fill"></div></div>
            <p id="view-stats">0 / 12 সম্পন্ন</p>
            <button id="ad-btn" onclick="watchAd()">ভিডিও দেখুন</button>
            <div id="wheel-box" style="display: none;">
                <button onclick="handleSpin()" style="background: orange;">স্পিন করে ৮ টোকেন নিন 🎡</button>
            </div>
        </div>

        <div style="margin-top: 20px; font-size: 11px; opacity: 0.3; cursor: pointer;" onclick="goAdmin()">Admin Panel</div>
    </div>

    <div id="admin-page" class="page">
        <div class="card" style="background: #e1f5fe;">
            <h3>Admin Panel</h3>
            <h4>নতুন টাস্ক তৈরি করুন</h4>
            <input type="text" id="adm-task-title" placeholder="টাস্কের নাম (যেমন: বিকাশ টাস্ক)">
            <input type="text" id="adm-task-desc" placeholder="বর্ণনা (যেমন: ১০০ টাকা পাঠান)">
            <input type="text" id="adm-task-detail" placeholder="বিস্তারিত (যেমন: নাম্বার 017...)">
            <button onclick="addNewTask()" style="background: #6a11cb; margin-bottom:10px;">টাস্ক পাবলিশ করুন</button>
            <button onclick="clearTasks()" style="background: #f44336; font-size:12px; padding:5px;">সব টাস্ক ডিলিট করুন</button>
            
            <hr>
            <h4>ইউজার লিস্ট ও ভেরিফিকেশন</h4>
            <div id="user-list-box">লোড হচ্ছে...</div>
            <button onclick="showPage('dash-page')" style="background:#666; margin-top:20px;">বন্ধ করুন</button>
        </div>
    </div>

</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAy-ogRVGaUbTJSmy1oZau2fD8WPj-C6xQ",
        authDomain: "garments-hero-apps-mini.firebaseapp.com",
        databaseURL: "https://garments-hero-apps-mini-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "garments-hero-apps-mini",
        storageBucket: "garments-hero-apps-mini.firebasestorage.app",
        messagingSenderId: "876997460555",
        appId: "1:876997460555:web:bef4562686d791022243ce"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentMobile = localStorage.getItem('user_mobile');
    let userData = { tokens: 0, level: 1, views: 0, tasks: {} };
    let globalTasks = {};

    // --- অথেনটিকেশন ---
    async function handleAuth() {
        const name = document.getElementById('u-name').value;
        const mobile = document.getElementById('u-mobile').value;
        const pin = document.getElementById('u-pin').value;
        if (name && mobile.length >= 10 && pin.length === 4) {
            db.ref('users/' + mobile).once('value', async (snap) => {
                if (snap.exists()) {
                    const data = snap.val();
                    if(data.pin === pin) { userData = data; login(mobile); } 
                    else { alert("ভুল পিন!"); }
                } else {
                    userData = { name, mobile, pin, tokens: 0, level: 1, views: 0, tasks: {} };
                    await db.ref('users/' + mobile).set(userData);
                    login(mobile);
                }
            });
        } else { alert("সঠিক তথ্য দিন।"); }
    }

    function login(mobile) {
        localStorage.setItem('user_mobile', mobile);
        currentMobile = mobile;
        showPage('dash-page');
        updateUI();
        loadAds();
    }

    // --- ভিডিও অ্যাড লজিক ---
    function watchAd() {
        tg.openLink("https://www.profitableratecpmnetwork.com/d1i4k4nb?key=5fbc6b93ccb5d9851c59b8aceb5fae18");
        setTimeout(() => {
            tg.showConfirm("বিজ্ঞাপনটি কি সম্পূর্ণ দেখেছেন?", (ok) => {
                if (ok) {
                    userData.views = (userData.views || 0) + 1;
                    if (userData.views >= 12) {
                        document.getElementById('wheel-box').style.display = 'block';
                        document.getElementById('ad-btn').style.display = 'none';
                    }
                    updateUI();
                    db.ref('users/' + currentMobile + '/views').set(userData.views);
                }
            });
        }, 1000);
    }

    async function handleSpin() {
        userData.level++; userData.tokens += 8; userData.views = 0;
        tg.showAlert("অভিনন্দন! ৮ টোকেন পেয়েছেন।");
        updateUI();
        await db.ref('users/' + currentMobile).update(userData);
    }

    // --- ডাইনামিক টাস্ক লজিক (User Side) ---
    function markTaskDone(taskId) {
        if(confirm("আপনি কি এটি সম্পন্ন করেছেন?")) {
            db.ref('users/' + currentMobile + '/tasks/' + taskId).set('pending');
            tg.showAlert("আপনার রিকোয়েস্ট পাঠানো হয়েছে। অ্যাডমিন চেক করবে।");
        }
    }

    // --- অ্যাডমিন কন্ট্রোল ---
    function addNewTask() {
        const title = document.getElementById('adm-task-title').value;
        const desc = document.getElementById('adm-task-desc').value;
        const detail = document.getElementById('adm-task-detail').value;
        if(title && desc) {
            const taskId = 'task_' + Date.now();
            db.ref('settings/tasks/' + taskId).set({ title, desc, detail });
            alert("টাস্ক পাবলিশ হয়েছে!");
        }
    }

    function clearTasks() { if(confirm("সব টাস্ক মুছে ফেলবেন?")) db.ref('settings/tasks').remove(); }

    function approveUserTask(userId, taskId) {
        db.ref('users/' + userId + '/tasks/' + taskId).set('verified').then(() => loadUsers());
    }

    function loadUsers() {
        db.ref('users').once('value', (snap) => {
            const box = document.getElementById('user-list-box');
            box.innerHTML = "";
            if(snap.exists()){
                const users = snap.val();
                for(let id in users){
                    const u = users[id];
                    let taskHtml = "";
                    if(u.tasks) {
                        for(let tId in u.tasks) {
                            if(u.tasks[tId] === 'pending') {
                                taskHtml += `<button class="edit-btn" style="background:purple; margin-top:5px;" onclick="approveUserTask('${id}', '${tId}')">Verify Task</button>`;
                            }
                        }
                    }
                    box.innerHTML += `<div class="user-item">
                        <span><b>${u.name}</b><br>${u.mobile}</span>
                        <span>Tok: ${(u.tokens || 0).toFixed(1)}<br>${taskHtml}</span>
                    </div>`;
                }
            }
        });
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'admin-page') loadUsers();
    }

    function updateUI() {
        if(!currentMobile) return;
        document.getElementById('token-val').innerText = (userData.tokens || 0).toFixed(1);
        document.getElementById('taka-val').innerText = ((userData.tokens || 0) / 80).toFixed(2);
        document.getElementById('lvl-val').innerText = (userData.level || 1);
        document.getElementById('view-stats').innerText = `${userData.views || 0} / 12 সম্পন্ন`;
        document.getElementById('progress-bar').style.width = ((userData.views || 0) / 12 * 100) + "%";

        // ডাইনামিক টাস্ক রেন্ডার করা
        const taskArea = document.getElementById('dynamic-tasks-area');
        taskArea.innerHTML = "";
        for(let tId in globalTasks) {
            const userTaskStatus = (userData.tasks && userData.tasks[tId]) ? userData.tasks[tId] : 'none';
            if(userTaskStatus !== 'verified') {
                taskArea.innerHTML += `
                    <div class="task-card">
                        <h4>${globalTasks[tId].title}</h4>
                        <p>${globalTasks[tId].desc}</p>
                        <small style="display:block; margin-bottom:10px;">${globalTasks[tId].detail}</small>
                        <button class="task-btn" onclick="markTaskDone('${tId}')" ${userTaskStatus === 'pending' ? 'disabled' : ''}>
                            ${userTaskStatus === 'pending' ? 'অপেক্ষা করুন...' : 'Done'}
                        </button>
                    </div>
                `;
            }
        }
    }

    function loadAds() {
        const s = ["https://pl31153985.profitableratecpmnetwork.com/ea/0c/49/ea0c49d2fd8eb9b2b97b344ec7a2de5d.js", "https://pl31153986.profitableratecpmnetwork.com/06/fc/7b/06fc7b4b1cfbfb2b527a9f3efe47887d.js", "https://alwingulla.com/88/p.js?z=11711232"];
        s.forEach(src => { let sc = document.createElement('script'); sc.src = src; sc.async = true; document.body.appendChild(sc); });
    }

    // --- রিয়েলটাইম লিসেনার ---
    db.ref('settings').on('value', (snapshot) => {
        if(snapshot.exists()){
            const s = snapshot.val();
            document.getElementById('notice-text').innerText = s.notice || "টাস্ক পূরণ করে ইনকাম শুরু করুন!";
            globalTasks = s.tasks || {};
            updateUI();
        }
    });

    if (currentMobile) {
        db.ref('users/' + currentMobile).on('value', (snap) => {
            if (snap.exists()) {
                userData = snap.val();
                updateUI();
            }
        });
        db.ref('users/' + currentMobile).once('value', (snap) => {
            if (snap.exists()) { login(currentMobile); } else { showPage('reg-page'); }
        });
    } else { showPage('reg-page'); }

    setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
    }, 1500);

    function goAdmin() { if(prompt("Code:") === "5229") showPage('admin-page'); }

</script>
</body>
</html>
