<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Earn Pro - Multi-Ad Network</title>
    
    <!-- Monetag Verification Meta -->
    <meta name="monetag" content="713c462f8287529e227a1dc55fdecd73">

    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Adsterra Social Bar & Popunder -->
    <script src="https://pl31153985.profitableratecpmnetwork.com/ea/0c/49/ea0c49d2fd8eb9b2b97b344ec7a2de5d.js"></script>
    <script src="https://pl31153986.profitableratecpmnetwork.com/06/fc/7b/06fc7b4b1cfbfb2b527a9f3efe47887d.js"></script>

    <!-- Monetag Smart Tag / Onclick Script -->
    <script src="https://alwingulla.com/88/p.js?z=11711232" async data-cfasync="false"></script>

    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #ffffff);
            --tg-text: var(--tg-theme-text-color, #222222);
            --tg-hint: var(--tg-theme-hint-color, #999999);
            --tg-btn: var(--tg-theme-button-color, #2481cc);
            --tg-btn-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f2f5);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            margin: 0; padding: 0;
            text-align: center;
        }

        .container { padding: 15px; max-width: 500px; margin: auto; }
        .page { display: none; }
        .active { display: block; }

        .card {
            background: var(--secondary-bg);
            padding: 20px; border-radius: 15px;
            margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .notice-board {
            background: #fff9c4; color: #856404; padding: 10px;
            border-radius: 8px; margin-bottom: 15px;
            border-left: 5px solid #fbc02d; font-size: 14px; font-weight: bold;
        }

        input {
            width: 100%; padding: 12px; margin: 10px 0;
            border: 1px solid var(--tg-hint); border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%; padding: 15px; background: var(--tg-btn);
            color: var(--tg-btn-text); border: none; border-radius: 10px;
            font-weight: bold; font-size: 16px; cursor: pointer;
        }

        .progress-container {
            background: #e0e0e0; height: 12px; border-radius: 10px;
            margin: 15px 0; overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            width: 0%; height: 100%; transition: 0.3s;
        }

        #wheel {
            width: 150px; height: 150px; border-radius: 50%;
            border: 5px solid var(--tg-text); margin: 15px auto;
            transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            background: conic-gradient(#f44336 0% 25%, #ffeb3b 25% 50%, #2196f3 50% 75%, #4caf50 75% 100%);
        }

        .ad-unit { margin: 10px 0; min-height: 50px; overflow: hidden; }
    </style>
</head>
<body>

<div class="container">

    <!-- Adsterra Top Banner -->
    <div class="ad-unit">
        <script>
            atOptions = {
                'key' : '22791b3315db724a6660643268b32cc2',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
            };
        </script>
        <script src="https://www.highrevenueformat.com/22791b3315db724a6660643268b32cc2/invoke.js"></script>
    </div>

    <!-- ১. রেজিস্ট্রেশন -->
    <div id="reg-page" class="page active">
        <div class="card">
            <h2>স্বাগতম</h2>
            <p>আপনার অ্যাকাউন্ট তৈরি করুন</p>
            <input type="text" id="u-name" placeholder="নাম">
            <input type="tel" id="u-mobile" placeholder="মোবাইল নম্বর">
            <input type="password" id="u-pin" placeholder="৪ ডিজিট পিন" maxlength="4">
            <button onclick="handleRegister()">শুরু করুন</button>
        </div>
    </div>

    <!-- ২. ড্যাশবোর্ড -->
    <div id="dash-page" class="page">
        <div class="notice-board" id="notice-text">লোডিং নোটিশ...</div>

        <div class="card" style="background: var(--tg-btn); color: #fff;">
            <small>মোট আয়</small>
            <h1 id="bal-val" style="margin: 5px 0;">0.00 Taka</h1>
            <div style="display: flex; justify-content: space-between; font-size: 13px;">
                <span>লেভেল: <b id="lvl-val">1</b> / 100,000</span>
                <span>ইউজার: <b id="name-val">...</b></span>
            </div>
        </div>

        <div class="card">
            <h3>ভিডিও টাস্ক (১২টি)</h3>
            <div class="progress-container">
                <div id="progress-bar" class="progress-fill"></div>
            </div>
            <p id="view-stats" style="font-weight:bold;">0 / 12</p>
            <button id="ad-btn" onclick="watchVideoAd()">ভিডিও দেখুন (Ad)</button>

            <!-- বোনাস হুইল -->
            <div id="wheel-box" style="display: none; margin-top: 20px;">
                <hr>
                <p>লেভেল শেষ করতে স্পিন করুন</p>
                <div id="wheel"></div>
                <button id="spin-btn" onclick="handleSpin()">স্পিন করুন এবং ১০ পয়সা নিন</button>
            </div>
        </div>

        <!-- Adsterra Native / Monetag Container Ad -->
        <div class="ad-unit">
            <script async="async" data-cfasync="false" src="https://pl31153987.profitableratecpmnetwork.com/a89c594005448c0475de633a657cd90e/invoke.js"></script>
            <div id="container-a89c594005448c0475de633a657cd90e"></div>
        </div>

        <div style="margin-top: 20px; font-size: 11px; opacity: 0.6; cursor: pointer;" onclick="openAdmin()">Admin Access</div>
    </div>

    <!-- ৩. অ্যাডমিন প্যানেল -->
    <div id="admin-page" class="page">
        <div class="card">
            <h3>অ্যাডমিন প্যানেল</h3>
            <input type="text" id="new-notice" placeholder="নোটিশ আপডেট করুন">
            <button onclick="updateNotice()">Update Notice</button>
            <button style="margin-top:10px; background:#444;" onclick="showPage('dash-page')">ফিরে যান</button>
        </div>
    </div>

</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // অ্যাড ইউআরএল
    const ADSTERRA_DIRECT = "https://www.profitableratecpmnetwork.com/d1i4k4nb?key=5fbc6b93ccb5d9851c59b8aceb5fae18";
    const MONETAG_DIRECT = "https://5gvci.com/act/files/service-worker.min.js?r=sw"; // আপনার Monetag লিংক
    const ADMIN_PIN = "1234";

    let state = JSON.parse(localStorage.getItem('earn_ultra_data')) || {
        name: "", mobile: "", balance: 0.00, level: 1, views: 0,
        notice: "প্রতি লেভেল সম্পন্ন করলে পাবেন ১০ পয়সা!",
        isRegistered: false
    };

    if(state.isRegistered) {
        showPage('dash-page');
        updateUI();
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function handleRegister() {
        const n = document.getElementById('u-name').value;
        const m = document.getElementById('u-mobile').value;
        const p = document.getElementById('u-pin').value;
        if(n && m && p.length === 4) {
            state.name = n; state.mobile = m; state.isRegistered = true;
            save(); showPage('dash-page'); updateUI();
        } else {
            tg.showAlert("দয়া করে সঠিক তথ্য দিন।");
        }
    }

    function watchVideoAd() {
        // একবার Adsterra একবার Monetag লিংক ওপেন হবে ইনকাম বাড়ানোর জন্য
        const targetAd = (state.views % 2 === 0) ? ADSTERRA_DIRECT : ADSTERRA_DIRECT; 
        
        tg.openLink(targetAd);
        
        tg.showConfirm("আপনি কি বিজ্ঞাপনটি দেখেছেন?", (ok) => {
            if(ok) {
                state.views++;
                if(state.views >= 12) {
                    document.getElementById('ad-btn').disabled = true;
                    document.getElementById('wheel-box').style.display = 'block';
                }
                updateUI(); save();
            }
        });
    }

    function handleSpin() {
        const wheel = document.getElementById('wheel');
        const deg = Math.floor(3000 + Math.random() * 3000);
        wheel.style.transform = `rotate(${deg}deg)`;
        document.getElementById('spin-btn').disabled = true;

        setTimeout(() => {
            state.level++;
            state.balance += 0.10; // ১০ পয়সা রিওয়ার্ড
            state.views = 0;
            tg.showAlert(`লেভেল ${state.level-1} সম্পন্ন! ১০ পয়সা যোগ হয়েছে।`);
            
            document.getElementById('wheel-box').style.display = 'none';
            document.getElementById('ad-btn').disabled = false;
            document.getElementById('spin-btn').disabled = false;
            wheel.style.transition = 'none';
            wheel.style.transform = 'rotate(0deg)';
            setTimeout(() => wheel.style.transition = 'transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99)', 50);
            
            updateUI(); save();
        }, 3500);
    }

    function updateUI() {
        document.getElementById('bal-val').innerText = state.balance.toFixed(2) + " Taka";
        document.getElementById('lvl-val').innerText = state.level.toLocaleString();
        document.getElementById('name-val').innerText = state.name;
        document.getElementById('view-stats').innerText = `${state.views} / 12 সম্পন্ন`;
        document.getElementById('notice-text').innerText = state.notice;
        document.getElementById('progress-bar').style.width = (state.views / 12 * 100) + "%";
    }

    function openAdmin() {
        if(prompt("Admin PIN:") === ADMIN_PIN) showPage('admin-page');
    }

    function updateNotice() {
        const msg = document.getElementById('new-notice').value;
        if(msg) {
            state.notice = msg;
            save(); updateUI();
            showPage('dash-page');
        }
    }

    function save() {
        localStorage.setItem('earn_ultra_data', JSON.stringify(state));
    }
</script>

</body>
</html>
