<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Earn Pro - Ultimate Edition</title>
    
    <!-- Monetag Verification -->
    <meta name="monetag" content="713c462f8287529e227a1dc55fdecd73">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #ffffff);
            --tg-text: var(--tg-theme-text-color, #222222);
            --tg-btn: var(--tg-theme-button-color, #2481cc);
            --tg-btn-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f2f5);
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--tg-bg); color: var(--tg-text); margin: 0; padding: 0; text-align: center; }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .page { display: none; padding-bottom: 50px; }
        .active { display: block; }
        .card { background: var(--secondary-bg); padding: 20px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: left; }
        .token-display { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 2px solid #fff; text-align: center;}
        .token-count { font-size: 35px; font-weight: bold; display: block; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--tg-btn); color: var(--tg-btn-text); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .progress-container { background: #ddd; height: 12px; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .progress-fill { background: #4caf50; width: 0%; height: 100%; transition: 0.3s; }
        #wheel { width: 140px; height: 140px; border-radius: 50%; border: 4px solid #333; margin: 15px auto; transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99); background: conic-gradient(#f44336 0% 25%, #ffeb3b 25% 50%, #2196f3 50% 75%, #4caf50 75% 100%); }
        .ad-slot { margin: 10px 0; min-height: 50px; text-align: center; }
        .user-row { border-bottom: 1px solid #ddd; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        #loading { padding: 100px 20px; font-weight: bold; }
    </style>
</head>
<body>

<div id="loading">লোড হচ্ছে...</div>

<div class="container" id="main-content" style="display: none;">

    <!-- রেজিস্ট্রেশন পেজ -->
    <div id="reg-page" class="page">
        <div class="card" style="text-align: center;">
            <h2>রেজিস্ট্রেশন</h2>
            <input type="text" id="u-name" placeholder="নাম">
            <input type="tel" id="u-mobile" placeholder="মোবাইল নম্বর">
            <input type="password" id="u-pin" placeholder="৪ ডিজিট পিন" maxlength="4">
            <button onclick="window.handleRegister()">শুরু করুন</button>
        </div>
    </div>

    <!-- ড্যাশবোর্ড -->
    <div id="dash-page" class="page">
        <!-- Banner Ad -->
        <div class="ad-slot">
            <script>atOptions = { 'key' : '22791b3315db724a6660643268b32cc2', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };</script>
            <script src="https://www.highrevenueformat.com/22791b3315db724a6660643268b32cc2/invoke.js"></script>
        </div>

        <div id="notice-text" class="card" style="background:#fff9c4; font-size:12px; font-weight:bold; text-align:center;">নোটিশ লোড হচ্ছে...</div>
        
        <div class="token-display">
            <small>মোট ব্যালেন্স</small>
            <span class="token-count" id="token-val">0</span>
            <div style="display: flex; justify-content: space-between; margin-top: 5px;">
                <span>৳ <b id="taka-val">0.00</b></span>
                <span>লেভেল: <b id="lvl-val">1</b></span>
            </div>
        </div>

        <div class="card" style="text-align: center;">
            <h3>ভিডিও টাস্ক (১২টি)</h3>
            <div class="progress-container"><div id="progress-bar" class="progress-fill"></div></div>
            <p id="view-stats">0 / 12 সম্পন্ন</p>
            <button id="ad-btn" onclick="window.watchVideoAd()">ভিডিও দেখুন (Reward)</button>
            <div id="wheel-box" style="display: none; margin-top: 15px;">
                <div id="wheel"></div>
                <button id="spin-btn" onclick="window.handleSpin()">স্পিন করে ৮ টোকেন নিন</button>
            </div>
        </div>

        <div class="card">
            <h4>👫 রেফারেল লিংক</h4>
            <small id="ref-link" style="background:#fff; padding:5px; border:1px solid #ccc; display:block; margin-bottom:10px; word-break:break-all;">Loading...</small>
            <button onclick="window.copyRef()" style="background:#4caf50; padding:10px; font-size:14px;">লিংক কপি করুন</button>
        </div>

        <div class="card">
            <h4>💰 উইথড্র (উত্তোলন)</h4>
            <div id="wd-locked" style="color:red; font-weight:bold; text-align:center;">মিশন চলছে! উইথড্র এখন বন্ধ।</div>
            <div id="wd-unlocked" style="display:none;">
                <input type="number" id="wd-amt" placeholder="টাকার পরিমাণ">
                <input type="tel" id="wd-num" placeholder="নম্বর (Bkash/Nagad)">
                <button onclick="alert('রিকোয়েস্ট পাঠানো হয়েছে!')" style="background:#e91e63;">উইথড্র রিকোয়েস্ট</button>
            </div>
        </div>

        <!-- Native Ad -->
        <div class="ad-slot">
            <script async="async" data-cfasync="false" src="https://pl31153987.profitableratecpmnetwork.com/a89c594005448c0475de633a657cd90e/invoke.js"></script>
            <div id="container-a89c594005448c0475de633a657cd90e"></div>
        </div>

        <div style="margin-top: 20px; font-size: 11px; opacity: 0.3; cursor: pointer;" onclick="window.goAdmin()">Admin Panel</div>
    </div>

    <!-- ফুল অ্যাডমিন প্যানেল -->
    <div id="admin-page" class="page">
        <div class="card">
            <button onclick="window.showPage('dash-page')" style="background:#666; margin-bottom:10px;">বন্ধ করুন</button>
            <h3>অ্যাডমিন ড্যাশবোর্ড</h3>
            <button onclick="window.toggleMission()" id="mission-btn" style="background:green; margin-bottom:10px;">উইথড্র চালু/বন্ধ</button>
            <input type="text" id="admin-notice" placeholder="নতুন নোটিশ">
            <button onclick="window.updateNotice()">নোটিশ আপডেট</button>
            
            <hr>
            <h4>ইউজার লিস্ট (সব ব্যবহারকারী)</h4>
            <div id="user-list">লোড হচ্ছে...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child, update, onValue, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAy-ogRVGaUbTJSmy1oZau2fD8WPj-C6xQ",
        authDomain: "garments-hero-apps-mini.firebaseapp.com",
        databaseURL: "https://garments-hero-apps-mini-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "garments-hero-apps-mini",
        storageBucket: "garments-hero-apps-mini.firebasestorage.app",
        messagingSenderId: "876997460555",
        appId: "1:876997460555:web:bef4562686d791022243ce"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const tg = window.Telegram.WebApp;

    const userId = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id.toString() : "guest_" + Math.floor(Math.random()*1000);
    let userData = {};
    let isWDOpen = false;

    async function init() {
        try {
            const snap = await get(child(ref(db), `users/${userId}`));
            if (snap.exists()) {
                userData = snap.val();
                window.showPage('dash-page');
                loadScripts(); // অ্যাড স্ক্রিপ্ট লোড
            } else {
                window.showPage('reg-page');
            }

            onValue(ref(db, 'settings'), (snapshot) => {
                if(snapshot.exists()) {
                    const s = snapshot.val();
                    document.getElementById('notice-text').innerText = s.notice || "টাস্ক পূরণ করুন!";
                    isWDOpen = s.missionComplete || false;
                    document.getElementById('wd-locked').style.display = isWDOpen ? 'none' : 'block';
                    document.getElementById('wd-unlocked').style.display = isWDOpen ? 'block' : 'none';
                    document.getElementById('mission-btn').innerText = isWDOpen ? "উইথড্র বন্ধ করুন" : "উইথড্র চালু করুন";
                    document.getElementById('mission-btn').style.background = isWDOpen ? "red" : "green";
                }
            });

            updateUI();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('ref-link').innerText = `https://t.me/YourBotUsername/app?startapp=${userId}`;
        } catch (e) {
            alert("কানেকশন এরর! পেজ রিফ্রেশ করুন।");
        }
    }

    window.handleRegister = async () => {
        const n = document.getElementById('u-name').value;
        const m = document.getElementById('u-mobile').value;
        const refId = tg.initDataUnsafe.start_param || null;
        if (n && m) {
            userData = { name: n, mobile: m, tokens: 0, level: 1, views: 0, refBy: refId, totalEarn: 0 };
            await set(ref(db, 'users/' + userId), userData);
            if(refId && refId !== userId) {
                await update(ref(db, `users/${refId}`), { tokens: increment(400) });
            }
            window.showPage('dash-page');
            loadScripts();
            updateUI();
        }
    };

    window.watchVideoAd = () => {
        tg.openLink("https://www.profitableratecpmnetwork.com/d1i4k4nb?key=5fbc6b93ccb5d9851c59b8aceb5fae18");
        tg.showConfirm("বিজ্ঞাপন দেখেছেন?", async (ok) => {
            if (ok) {
                userData.views = (userData.views || 0) + 1;
                if (userData.views >= 12) {
                    document.getElementById('wheel-box').style.display = 'block';
                    document.getElementById('ad-btn').disabled = true;
                }
                updateUI();
                await update(ref(db, 'users/' + userId), { views: userData.views });
            }
        });
    };

    window.handleSpin = () => {
        const wheel = document.getElementById('wheel');
        wheel.style.transform = `rotate(${Math.floor(3000 + Math.random() * 3000)}deg)`;
        document.getElementById('spin-btn').disabled = true;
        setTimeout(async () => {
            userData.level++; userData.tokens += 8; userData.totalEarn += 8; userData.views = 0;
            if(userData.refBy && userData.totalEarn >= 40000) {
                await update(ref(db, `users/${userData.refBy}`), { tokens: increment(0.4) });
            }
            tg.showAlert("অভিনন্দন! আপনি ৮ টোকেন পেয়েছেন।");
            document.getElementById('wheel-box').style.display = 'none';
            document.getElementById('ad-btn').disabled = false;
            document.getElementById('spin-btn').disabled = false;
            wheel.style.transform = 'rotate(0deg)';
            updateUI();
            await update(ref(db, 'users/' + userId), userData);
        }, 3500);
    };

    window.loadUserList = async () => {
        const snap = await get(child(ref(db), 'users'));
        const list = document.getElementById('user-list');
        list.innerHTML = "";
        if(snap.exists()){
            const users = snap.val();
            for(let id in users){
                const u = users[id];
                const row = document.createElement('div');
                row.className = "user-row";
                row.innerHTML = `<span>${u.name}<br><small>${u.mobile}</small></span>
                <span>${u.tokens.toFixed(1)} Tok | Lvl ${u.level} <br> <button onclick="window.editUser('${id}')" style="padding:2px 5px; font-size:10px; background:#444;">Edit</button></span>`;
                list.appendChild(row);
            }
        }
    };

    window.editUser = async (id) => {
        const nt = prompt("নতুন টোকেন:");
        const nl = prompt("নতুন লেভেল:");
        if(nt && nl) {
            await update(ref(db, `users/${id}`), { tokens: parseFloat(nt), level: parseInt(nl) });
            alert("Updated!");
            window.loadUserList();
        }
    };

    window.copyRef = () => {
        navigator.clipboard.writeText(document.getElementById('ref-link').innerText);
        tg.showAlert("লিংক কপি হয়েছে!");
    };

    window.toggleMission = async () => { await update(ref(db, 'settings'), { missionComplete: !isWDOpen }); };
    window.updateNotice = async () => { await update(ref(db, 'settings'), { notice: document.getElementById('admin-notice').value }); alert("Notice Updated!"); };
    window.showPage = (id) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'admin-page') window.loadUserList();
    };
    window.goAdmin = () => { if(prompt("Code:") === "5229") window.showPage('admin-page'); };

    function updateUI() {
        document.getElementById('token-val').innerText = (userData.tokens || 0).toFixed(1);
        document.getElementById('taka-val').innerText = ((userData.tokens || 0) / 80).toFixed(2);
        document.getElementById('lvl-val').innerText = (userData.level || 1);
        document.getElementById('name-val').innerText = userData.name || "...";
        document.getElementById('view-stats').innerText = `${userData.views || 0} / 12 সম্পন্ন`;
        document.getElementById('progress-bar').style.width = ((userData.views || 0) / 12 * 100) + "%";
    }

    function loadScripts() {
        const scripts = [
            "https://pl31153985.profitableratecpmnetwork.com/ea/0c/49/ea0c49d2fd8eb9b2b97b344ec7a2de5d.js",
            "https://pl31153986.profitableratecpmnetwork.com/06/fc/7b/06fc7b4b1cfbfb2b527a9f3efe47887d.js",
            "https://alwingulla.com/88/p.js?z=11711232"
        ];
        scripts.forEach(src => {
            let s = document.createElement('script'); s.src = src; s.async = true; document.head.appendChild(s);
        });
    }

    init();
</script>
</body>
</html>
