<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Earn Pro - Mission Mode</title>
    
    <meta name="monetag" content="713c462f8287529e227a1dc55fdecd73">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #ffffff);
            --tg-text: var(--tg-theme-text-color, #222222);
            --tg-btn: var(--tg-theme-button-color, #2481cc);
            --tg-btn-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f2f5);
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--tg-bg); color: var(--tg-text); margin: 0; padding: 0; text-align: center; }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .page { display: none; }
        .active { display: block; }
        .card { background: var(--secondary-bg); padding: 20px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: left; }
        
        /* Balance UI */
        .token-display { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 2px solid #fff; text-align: center;}
        .token-count { font-size: 35px; font-weight: bold; display: block; }
        
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--tg-btn); color: var(--tg-btn-text); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        /* Withdraw Styles */
        .withdraw-method { display: flex; justify-content: space-around; margin: 15px 0; }
        .method-box { padding: 10px; border: 1px solid #ccc; border-radius: 8px; width: 30%; text-align: center; font-size: 12px; background: #fff; cursor: pointer;}
        .method-box.selected { border: 2px solid var(--tg-btn); background: #e3f2fd; }
        .locked-msg { color: #f44336; font-weight: bold; text-align: center; padding: 10px; border: 1px dashed #f44336; border-radius: 10px; background: #ffebee; }

        .progress-container { background: #ddd; height: 12px; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .progress-fill { background: #4caf50; width: 0%; height: 100%; transition: 0.3s; }
        #wheel { width: 140px; height: 140px; border-radius: 50%; border: 4px solid #333; margin: 15px auto; transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99); background: conic-gradient(#f44336 0% 25%, #ffeb3b 25% 50%, #2196f3 50% 75%, #4caf50 75% 100%); }
        #loading { padding: 50px; font-weight: bold; }
    </style>
</head>
<body>

<div id="loading">লোড হচ্ছে...</div>

<div class="container" id="main-content" style="display: none;">

    <!-- রেজিস্ট্রেশন -->
    <div id="reg-page" class="page">
        <div class="card" style="text-align: center;">
            <h2>রেজিস্ট্রেশন</h2>
            <input type="text" id="u-name" placeholder="নাম">
            <input type="tel" id="u-mobile" placeholder="মোবাইল নম্বর">
            <input type="password" id="u-pin" placeholder="৪ ডিজিট পিন" maxlength="4">
            <button onclick="handleRegister()">শুরু করুন</button>
        </div>
    </div>

    <!-- ড্যাশবোর্ড -->
    <div id="dash-page" class="page">
        <div class="token-display">
            <small>আপনার টোকেন</small>
            <span class="token-count" id="token-val">0</span>
            <div style="display: flex; justify-content: space-between; margin-top: 5px; font-size: 12px;">
                <span>৳ <b id="taka-val">0.00</b> Taka</span>
                <span>লেভেল: <b id="lvl-val">1</b></span>
            </div>
        </div>

        <div class="card" style="text-align: center;">
            <h3>ভিডিও টাস্ক</h3>
            <div class="progress-container"><div id="progress-bar" class="progress-fill"></div></div>
            <p id="view-stats">0 / 12 সম্পন্ন</p>
            <button id="ad-btn" onclick="watchVideoAd()">অ্যাড দেখুন</button>

            <div id="wheel-box" style="display: none; margin-top: 15px;">
                <div id="wheel"></div>
                <button id="spin-btn" onclick="handleSpin()">স্পিন করে ৮ টোকেন নিন</button>
            </div>
        </div>

        <!-- উইথড্র সেকশন -->
        <div class="card">
            <h4>💰 টাকা উত্তোলন (Withdraw)</h4>
            <div id="withdraw-locked" class="locked-msg">
                মিশন চলছে! অ্যাডমিন মিশন কমপ্লিট করলে উইথড্র চালু হবে।
            </div>
            <div id="withdraw-unlocked" style="display: none;">
                <div class="withdraw-method">
                    <div class="method-box" onclick="selectMethod('Bkash')">Bkash</div>
                    <div class="method-box" onclick="selectMethod('Nagad')">Nagad</div>
                    <div class="method-box" onclick="selectMethod('Rocket')">Rocket</div>
                </div>
                <input type="number" id="withdraw-amount" placeholder="পরিমাণ (৳)">
                <input type="tel" id="withdraw-num" placeholder="মোবাইল নম্বর">
                <button onclick="submitWithdraw()" style="background: #e91e63;">উইথড্র রিকোয়েস্ট পাঠান</button>
            </div>
        </div>

        <div style="margin-top: 30px; font-size: 11px; opacity: 0.4; cursor: pointer;" onclick="checkAdmin()">Admin Panel</div>
    </div>

    <!-- অ্যাডমিন পেজ -->
    <div id="admin-page" class="page">
        <div class="card" style="background: #fff3e0;">
            <h3>Admin Mission Control</h3>
            <p>উইথড্র সিস্টেম অন/অফ করুন:</p>
            <button id="mission-btn" onclick="toggleMission()" style="background: orange;">মিশন কমপ্লিট (উইথড্র চালু করুন)</button>
            <hr>
            <button onclick="showPage('dash-page')" style="background: #666;">ফিরে যান</button>
            <div id="user-list" style="margin-top:20px;"></div>
        </div>
    </div>

</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAy-ogRVGaUbTJSmy1oZau2fD8WPj-C6xQ",
        authDomain: "garments-hero-apps-mini.firebaseapp.com",
        projectId: "garments-hero-apps-mini",
        storageBucket: "garments-hero-apps-mini.firebasestorage.app",
        messagingSenderId: "876997460555",
        appId: "1:876997460555:web:bef4562686d791022243ce",
        measurementId: "G-623RYXLL8M"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const tg = window.Telegram.WebApp;

    const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id.toString() : "test_user";
    let userData = {};
    let isMissionComplete = false;
    let selectedMethod = "";

    async function init() {
        // উইথড্র স্ট্যাটাস রিয়েল-টাইম চেক
        onValue(ref(db, 'settings/missionComplete'), (snapshot) => {
            isMissionComplete = snapshot.val() || false;
            updateWithdrawUI();
        });

        const snapshot = await get(child(ref(db), `users/${userId}`));
        if (snapshot.exists()) {
            userData = snapshot.val();
            showPage('dash-page');
            updateUI();
        } else {
            showPage('reg-page');
        }
        document.getElementById('loading').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
    }

    function updateWithdrawUI() {
        const locked = document.getElementById('withdraw-locked');
        const unlocked = document.getElementById('withdraw-unlocked');
        const adminBtn = document.getElementById('mission-btn');

        if (isMissionComplete) {
            locked.style.display = 'none';
            unlocked.style.display = 'block';
            adminBtn.innerText = "মিশন রি-সেট করুন (উইথড্র বন্ধ)";
            adminBtn.style.background = "red";
        } else {
            locked.style.display = 'block';
            unlocked.style.display = 'none';
            adminBtn.innerText = "মিশন কমপ্লিট (উইথড্র চালু)";
            adminBtn.style.background = "green";
        }
    }

    window.toggleMission = async () => {
        await set(ref(db, 'settings/missionComplete'), !isMissionComplete);
        alert("স্ট্যাটাস আপডেট হয়েছে!");
    };

    window.handleRegister = async () => {
        const name = document.getElementById('u-name').value;
        const mobile = document.getElementById('u-mobile').value;
        if (name && mobile) {
            userData = { name, mobile, tokens: 0, level: 1, views: 0 };
            await set(ref(db, 'users/' + userId), userData);
            showPage('dash-page');
            updateUI();
        }
    };

    window.selectMethod = (m) => {
        selectedMethod = m;
        document.querySelectorAll('.method-box').forEach(b => b.classList.remove('selected'));
        event.target.classList.add('selected');
    };

    window.submitWithdraw = () => {
        const amount = document.getElementById('withdraw-amount').value;
        const num = document.getElementById('withdraw-num').value;
        const userTaka = (userData.tokens / 80);

        if (!selectedMethod || !amount || !num) {
            tg.showAlert("সবগুলো ঘর পূরণ করুন!");
            return;
        }
        if (amount > userTaka) {
            tg.showAlert("আপনার ব্যালেন্স পর্যাপ্ত নয়!");
            return;
        }
        tg.showAlert(`সাফল্যের সাথে আপনার ${selectedMethod} রিকোয়েস্ট পাঠানো হয়েছে। অ্যাডমিন পেমেন্ট চেক করবে।`);
    };

    window.watchVideoAd = () => {
        tg.openLink("https://www.profitableratecpmnetwork.com/d1i4k4nb?key=5fbc6b93ccb5d9851c59b8aceb5fae18");
        tg.showConfirm("অ্যাড দেখেছেন?", async (ok) => {
            if (ok) {
                userData.views++;
                if (userData.views >= 12) {
                    document.getElementById('wheel-box').style.display = 'block';
                    document.getElementById('ad-btn').disabled = true;
                }
                updateUI();
                await update(ref(db, 'users/' + userId), { views: userData.views });
            }
        });
    };

    window.handleSpin = () => {
        const wheel = document.getElementById('wheel');
        const deg = Math.floor(3000 + Math.random() * 3000);
        wheel.style.transform = `rotate(${deg}deg)`;
        document.getElementById('spin-btn').disabled = true;

        setTimeout(async () => {
            userData.level++;
            userData.tokens += 8;
            userData.views = 0;
            tg.showAlert("অভিনন্দন! আপনি ৮ টোকেন পেয়েছেন।");
            document.getElementById('wheel-box').style.display = 'none';
            document.getElementById('ad-btn').disabled = false;
            document.getElementById('spin-btn').disabled = false;
            wheel.style.transform = 'rotate(0deg)';
            updateUI();
            await update(ref(db, 'users/' + userId), userData);
        }, 3500);
    };

    function updateUI() {
        document.getElementById('token-val').innerText = userData.tokens;
        document.getElementById('taka-val').innerText = (userData.tokens / 80).toFixed(2);
        document.getElementById('lvl-val').innerText = userData.level;
        document.getElementById('name-val').innerText = userData.name;
        document.getElementById('view-stats').innerText = `${userData.views} / 12 সম্পন্ন`;
        document.getElementById('progress-bar').style.width = (userData.views / 12 * 100) + "%";
    }

    window.checkAdmin = () => { if(prompt("Code:") === "5229") showPage('admin-page'); };
    window.showPage = (id) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    init();
</script>

</body>
</html>
